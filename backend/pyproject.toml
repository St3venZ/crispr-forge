[project]
name = "crispr-forge"
version = "0.1.0"
description = "Zero-Trust Prokaryotic CRISPR/Cas9 Gene Knockout Automated Design, In Silico Verification, and Wet-Lab Execution Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "biopython>=1.84",
    "primer3-py>=2.0.3",
    "openpyxl>=3.1.5",
    "openai>=1.55.0",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crispr_forge"]
