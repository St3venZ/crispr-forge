services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crispr-forge-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - FREE_TRIAL_DAILY_LIMIT=${FREE_TRIAL_DAILY_LIMIT:-10}
      - NCBI_EMAIL=${NCBI_EMAIL:-crispr-forge@example.com}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: crispr-forge-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
